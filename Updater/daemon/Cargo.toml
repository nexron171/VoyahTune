[package]
name = "voyahtune-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
release-core = { path = "../../Installer/crates/release-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"
fs2 = "0.4"
quick-xml = "0.42"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"

[dev-dependencies]
tempfile = "3"
