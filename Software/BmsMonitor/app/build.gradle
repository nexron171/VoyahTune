plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bms.monitor'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.bms.monitor"
        minSdk 24
        targetSdk 36            // Android 11
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            // bcprov и jsch содержат одинаковые OSGi-манифесты
            excludes += 'META-INF/versions/*/OSGI-INF/MANIFEST.MF'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = signingConfigs.getByName("debug")

        }
    }
}

// После ./gradlew assembleRelease класть готовый APK в корень проекта как BmsMonitor.apk
tasks.register('copyReleaseApk') {
    doLast {
        copy {
            from(layout.buildDirectory.file('outputs/apk/release/app-release.apk'))
            into(rootProject.projectDir)
            rename { 'BmsMonitor.apk' }
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease') {
        finalizedBy('copyReleaseApk')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // SSH-клиент
    implementation 'com.github.mwiede:jsch:0.2.17'
    // Ed25519 для JSch на Android (java.security не поддерживает EdDSA)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
