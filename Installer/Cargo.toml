[workspace]
resolver = "2"
members = ["crates/release-core", "crates/installer-core", "crates/installer-build", "desktop/src-tauri"]
default-members = ["crates/release-core", "crates/installer-core", "crates/installer-build"]

[workspace.package]
version = "1.5.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
directories = "6"
semver = "1"
tempfile = "3"
installer-core = { path = "crates/installer-core" }
